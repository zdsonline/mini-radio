<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📻 简易收音机</title>

    <!-- PWA 核心配置 -->
    <link rel="manifest" href="./manifest.json">
    <!-- 路径根据你实际存放位置调整 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <!-- iOS Safari 专属 PWA 补丁 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="收音机">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
        }

        .header .subtitle {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .display-panel {
            background: linear-gradient(135deg, #0a1628 0%, #132040 100%);
            border-radius: 20px;
            padding: 24px;
            margin: 16px 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .display-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(100, 200, 255, 0.3), transparent);
        }

        .station-name {
            font-size: 22px;
            font-weight: 700;
            color: #64c8ff;
            text-align: center;
            margin-bottom: 6px;
            min-height: 30px;
        }

        .station-freq {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-bottom: 16px;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #555;
            transition: all 0.3s;
        }

        .status-dot.active {
            background: #4caf50;
            box-shadow: 0 0 8px rgba(76, 175, 80, 0.6);
            animation: pulse 2s infinite;
        }

        .status-dot.error {
            background: #f44336;
            box-shadow: 0 0 8px rgba(244, 67, 54, 0.6);
        }

        .status-dot.loading {
            background: #ff9800;
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.6);
            animation: pulse 0.8s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .status-text {
            font-size: 12px;
            color: #888;
        }

        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 30px;
            gap: 3px;
            margin: 12px 0 4px;
        }

        .visualizer .bar {
            width: 4px;
            background: linear-gradient(to top, #64c8ff, #a78bfa);
            border-radius: 2px;
            height: 4px;
        }

        .visualizer.active .bar {
            animation: visualize 0.8s ease-in-out infinite alternate;
        }

        @keyframes visualize {
            0% {
                height: 4px;
            }

            100% {
                height: 28px;
            }
        }

        .visualizer.active .bar:nth-child(odd) {
            animation-delay: 0.1s;
        }

        .visualizer.active .bar:nth-child(3n) {
            animation-delay: 0.2s;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            padding: 20px 0;
        }

        .btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.92);
        }

        .btn-play {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64c8ff 0%, #4a9eff 100%);
            box-shadow: 0 4px 20px rgba(100, 200, 255, 0.35);
            font-size: 28px;
            color: #fff;
        }

        .btn-play.playing {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.35);
        }

        .btn-step {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            font-size: 18px;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .volume-section {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
            margin-bottom: 16px;
        }

        .volume-icon {
            font-size: 18px;
            color: #888;
            width: 24px;
            text-align: center;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #64c8ff;
            cursor: pointer;
        }

        .section-title {
            font-size: 13px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .preset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 12px;
            cursor: pointer;
            text-align: left;
        }

        .preset-btn:active {
            transform: scale(0.96);
        }

        .preset-btn.active {
            background: rgba(100, 200, 255, 0.12);
            border-color: rgba(100, 200, 255, 0.3);
        }

        .preset-btn .ch-name {
            font-size: 14px;
            font-weight: 600;
            color: #ddd;
            margin-bottom: 3px;
        }

        .preset-btn .ch-freq {
            font-size: 11px;
            color: #777;
        }

        .preset-btn.active .ch-name {
            color: #64c8ff;
        }

        .custom-section {
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .custom-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 14px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
        }

        .custom-input:focus {
            border-color: rgba(100, 200, 255, 0.4);
        }

        .custom-input::placeholder {
            color: #555;
        }

        .btn-go {
            background: linear-gradient(135deg, #64c8ff 0%, #4a9eff 100%);
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .input-hint {
            font-size: 11px;
            color: #666;
            padding-left: 4px;
        }

        .footer {
            text-align: center;
            padding: 16px 0;
            font-size: 11px;
            color: #444;
        }

        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📻 简易收音机</h1>
            <div class="subtitle">Internet Radio · 网络广播</div>
        </div>

        <div class="display-panel">
            <div class="station-name" id="stationName">选择电台开始收听</div>
            <div class="station-freq" id="stationFreq"></div>
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span class="status-text" id="statusText">待机中</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-step" onclick="prevStation()">⏮</button>
            <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="btn btn-step" onclick="nextStation()">⏭</button>
        </div>

        <div class="volume-section">
            <span class="volume-icon">🔈</span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80"
                oninput="changeVolume(this.value)">
            <span class="volume-icon">🔊</span>
        </div>

        <div class="section-title">⚡ 快捷电台</div>
        <div class="preset-grid" id="presetGrid"></div>

        <div class="custom-section">
            <div class="section-title">🔍 自定义电台</div>
            <div class="input-group">
                <input type="url" class="custom-input" id="customUrl" placeholder="输入直播流地址 (m3u8/mp3/aac)">
                <button class="btn btn-go" onclick="playCustomUrl()">收听</button>
            </div>
            <div class="input-hint">支持 m3u8 / mp3 / aac 等格式的直播流地址</div>
        </div>

        <div class="footer">基于 HTML5 Audio · 需要网络连接 · 0 成本方案</div>
    </div>

    <div class="toast" id="toast"></div>
    <audio id="radioPlayer" preload="none" playsinline></audio>

    <script>
        // 真实可用的直播流地址（已修复 Edge 兼容性问题）
        const STATIONS = [


            // 国内不稳定源
            {
                name: '991',
                freq: '991齐鲁网',
                url: 'https://tfzy2408x8719xcd00x1003xx29-audiolive302iqilucom.100ycdn.com/audiolive302.iqilu.com/sdradioYinyue/sdradio07/playlist.m3u8'
            },
            {
                name: '991',
                freq: '991喜马拉雅',
                url: 'https://live.ximalaya.com/radio-first-page-app/live/794/64.m3u8'
            },
            {
                name: '887',
                freq: '887喜马拉雅',
                url: 'https://live.ximalaya.com/radio-first-page-app/live/799/64.m3u8'
            },
            {
                name: 'BCC中广音乐',
                freq: 'BCC中广音乐',
                url: 'http://stream.rcs.revma.com/ks4vsmg3qtzuv'
            },

            // 📰 新闻与综合
            {
                name: 'BBC World Service',
                freq: '英国 · 英语环球新闻',
                url: 'https://stream.live.vc.bbcmedia.co.uk/bbc_world_service'
            },
            {
                name: 'NPR News',
                freq: '美国 · 国家公共广播',
                url: 'https://npr-ice.streamguys1.com/live.mp3'
            },
            {
                name: 'LBC News',
                freq: '英国 · 时事评论',
                url: 'https://media-ssl.musicradio.com/LBCNews'
            },

            // 🎵 流行与榜单
            {
                name: 'Capital FM',
                freq: '英国 · 热门金曲 Top40',
                url: 'https://media-ssl.musicradio.com/CapitalUK'
            },
            {
                name: 'Heart UK',
                freq: '英国 · 成人当代流行',
                url: 'https://media-ssl.musicradio.com/HeartUK'
            },
            {
                name: 'Pop Hits',
                freq: '欧美流行 · 经典与新作',
                url: 'https://listen.181fm.com/181-beatles_128k.mp3'
            },

            // 🎷 爵士、古典与轻松音乐
            {
                name: 'Classic FM',
                freq: '英国 · 古典音乐',
                url: 'https://media-ssl.musicradio.com/ClassicFM'
            },
            {
                name: 'Smooth Radio',
                freq: '英国 · 灵魂/爵士/R&B',
                url: 'https://media-ssl.musicradio.com/SmoothUK'
            },
            {
                name: 'Smooth Jazz',
                freq: '平滑爵士 · 工作背景音',
                url: 'https://listen.181fm.com/181-smoothjazz_128k.mp3'
            },

            // 🎧 独立、Lo-Fi 与特色精选
            {
                name: 'Radio Paradise',
                freq: '全球 · 独立/摇滚/电子精选',
                url: 'https://stream.radioparadise.com/aac-320'
            },
            {
                name: 'Lo-Fi Hip Hop',
                freq: '学习/编程 · 专注节拍',
                url: 'https://play.streamafrica.net/lofiradio'
            }
        ];

        const audio = document.getElementById('radioPlayer');
        let currentIndex = -1, isPlaying = false;

        function init() {
            renderPresets();
            audio.volume = 0.8;
            audio.addEventListener('playing', () => {isPlaying = true; updatePlayButton(true); setStatus('active', '正在播放'); document.getElementById('visualizer').classList.add('active');});
            audio.addEventListener('waiting', () => setStatus('loading', '缓冲中...'));
            audio.addEventListener('stalled', () => setStatus('loading', '缓冲中...'));
            audio.addEventListener('pause', () => {isPlaying = false; updatePlayButton(false); setStatus('', '已暂停'); document.getElementById('visualizer').classList.remove('active');});
            audio.addEventListener('error', () => {isPlaying = false; updatePlayButton(false); document.getElementById('visualizer').classList.remove('active'); setStatus('error', '播放出错，请重试');});
        }

        function renderPresets() {
            const grid = document.getElementById('presetGrid');
            grid.innerHTML = '';
            STATIONS.forEach((station, index) => {
                if (!station.url) return;
                const div = document.createElement('div');
                div.className = 'preset-btn';
                div.setAttribute('data-index', index);
                div.innerHTML = `<div class="ch-name">${station.name}</div><div class="ch-freq">${station.freq}</div>`;
                div.onclick = () => playStation(index);
                grid.appendChild(div);
            });
        }

        function playStation(index) {
            if (index < 0 || index >= STATIONS.length || !STATIONS[index].url) return;
            currentIndex = index;
            document.getElementById('stationName').textContent = STATIONS[index].name;
            document.getElementById('stationFreq').textContent = STATIONS[index].freq;
            document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.toggle('active', parseInt(btn.getAttribute('data-index')) === index));
            setStatus('loading', '正在连接...');
            audio.src = STATIONS[index].url;
            audio.load();
            audio.play().catch(err => setStatus('error', '点击播放按钮开始'));
        }

        function togglePlay() {
            if (currentIndex === -1 && !audio.src) {playStation(0); return;}
            if (isPlaying) {audio.pause();}
            else {
                if (!audio.src) {playStation(0); return;}
                setStatus('loading', '正在连接...');
                audio.play().catch(() => setStatus('error', '播放失败'));
            }
        }

        function prevStation() {playStation((currentIndex - 1 + STATIONS.length) % STATIONS.length);}
        function nextStation() {playStation((currentIndex + 1) % STATIONS.length);}

        function playCustomUrl() {
            const url = document.getElementById('customUrl').value.trim();
            if (!url) {showToast('请输入直播流地址'); return;}
            STATIONS.push({name: '自定义电台', freq: url.substring(0, 20) + '...', url: url});
            renderPresets();
            playStation(STATIONS.length - 1);
        }

        function changeVolume(val) {audio.volume = val / 100;}
        function updatePlayButton(playing) {const btn = document.getElementById('playBtn'); btn.textContent = playing ? '⏸' : '▶'; btn.classList.toggle('playing', playing);}
        function setStatus(type, text) {const dot = document.getElementById('statusDot'); dot.className = 'status-dot'; if (type) dot.classList.add(type); document.getElementById('statusText').textContent = text;}
        function showToast(msg) {const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500);}

        // 注册 Service Worker (使用相对路径)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW failed:', err));
            });
        }

        init();

        // 检测 SW 更新并提示用户
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                reg.onupdatefound = () => {
                    const newWorker = reg.installing;
                    newWorker.onstatechange = () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            // 检测到新版本已安装
                            showToast('🎉 频道列表已更新，请刷新页面');
                        }
                    };
                };
            });
        }
    </script>
</body>

</html>
